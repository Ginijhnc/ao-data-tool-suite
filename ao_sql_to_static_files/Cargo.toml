anyhow.workspace = true
chrono.workspace = true
aws-sdk-s3.workspace = true
aws-config.workspace = true
aws-credential-types.workspace = true
sha2.workspace = true

[dev-dependencies]
ao_shared = { path = "../ao_shared", features = ["testing"] }
