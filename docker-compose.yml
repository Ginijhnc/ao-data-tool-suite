services:
  parser:
    build:
      context: .
      dockerfile: ao_data_to_sql/Dockerfile
    env_file:
      - .env
    environment:
      - DB_HOST=host.docker.internal
      - CHARFILE_DIR=/ao-server/Charfile
    volumes:
      - ${CHARFILE_DIR}:/ao-server/Charfile:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
