[workspace]
resolver = "3"
members = [
    "ao_data_to_sql",
    "ao_shared",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/Ginijhnc/ao-data-tool-suite"
description = "Tools for managing Argentum Online game data"

[workspace.dependencies]
tokio = { version = "1.49.0", features = ["full"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "json", "migrate"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
encoding_rs = "0.8.35"
clap = { version = "4.5.54", features = ["derive", "env"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
thiserror = "2.0.18"
anyhow = "1.0.100"
rayon = "1.11.0"
walkdir = "2.5.0"
dotenvy = "0.15.7"
testcontainers = "0.26.3"
testcontainers-modules = { version = "0.14.0", features = ["postgres"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Allowed lints
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_arguments = "allow"
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"

# Selected restriction lints (not the full group)
cognitive_complexity = "warn"
alloc_instead_of_core = "warn"
std_instead_of_alloc = "warn"
std_instead_of_core = "warn"
exhaustive_enums = "warn"
exhaustive_structs = "warn"
mem_forget = "warn"
missing_docs_in_private_items = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
multiple_unsafe_ops_per_block = "warn"
missing_assert_message = "warn"
allow_attributes_without_reason = "warn"
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
as_conversions = "deny"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
clone_on_ref_ptr = "warn"
if_then_some_else_none = "warn"
impl_trait_in_params = "warn"
pattern_type_mismatch = "warn"
shadow_reuse = "warn"
shadow_unrelated = "warn"
str_to_string = "warn"
try_err = "warn"

[workspace.lints.rust]
unsafe_code = "forbid"