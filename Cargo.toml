[workspace]
resolver = "3"
members = [
    "ao_data_to_sql",
    "ao_shared",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Ginijhnc/ao-data-tool-suite"
description = "Tools for managing Argentum Online game data"

[workspace.dependencies]
tokio = { version = "1.49.0", features = ["full"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "json", "migrate"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
encoding_rs = "0.8.35"
clap = { version = "4.5.54", features = ["derive", "env"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
thiserror = "2.0.18"
anyhow = "1.0.100"
rayon = "1.11.0"
walkdir = "2.5.0"
dotenvy = "0.15.7"