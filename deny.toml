# Configuration for cargo-deny
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]

# -----------------------------------------------------------------------------
# Advisories - checks for known security vulnerabilities
# -----------------------------------------------------------------------------
[advisories]
ignore = [
    # rustls-pemfile: Unmaintained crate. Comes from bollard -> testcontainers.
    # Only affects dev dependencies. No upstream fix available yet.
    # https://rustsec.org/advisories/RUSTSEC-2025-0134
    "RUSTSEC-2025-0134",
]

# -----------------------------------------------------------------------------
# Licenses - ensures all dependencies use allowed licenses
# -----------------------------------------------------------------------------
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false
registries = []

# -----------------------------------------------------------------------------
# Bans - blocks specific crates or duplicate versions
# -----------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

deny = []
skip = []
skip-tree = []

# -----------------------------------------------------------------------------
# Sources - ensures dependencies come from trusted sources
# -----------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
